databases:
  - name: agency-dashboard-db
    plan: free
    databaseName: agency_dashboard
    user: agency

services:
  - type: web
    name: agency-dashboard-api
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: npm install && npm run prisma:generate --workspace server && npm run build:server
    startCommand: npm run prisma:migrate:deploy --workspace server && node server/dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agency-dashboard-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: CLIENT_ORIGIN
        sync: false
